<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabric Pro Drawing App</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto:wght@400;500&family=Open+Sans:wght@400;600&family=Montserrat:wght@400;600&family=Poppins:wght@400;600&family=Lato:wght@400;700&family=Nunito:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;600&family=Ubuntu:wght@400;700&display=swap"
    />
    <style>
      :root {
        --panel-width: 280px;
        --bg: #f2f4f8;
        --panel-bg: #141922;
        --panel-border: #273244;
        --panel-text: #e8edf7;
        --control-bg: #1d2633;
        --control-border: #334155;
        --control-text: #e2e8f0;
        --control-hover-bg: #273244;
        --label-text: #d4dceb;
        --hint-text: #96a3b8;
        --layer-panel-bg: rgba(20, 25, 34, 0.96);
        --layer-item-bg: #1a2230;
        --layer-item-border: #334155;
        --layer-item-active-bg: #eaf2ff;
        --layer-item-active-text: #0f172a;
      }

      body.theme-light {
        --panel-bg: #ffffff;
        --panel-border: #d8dde7;
        --panel-text: #1f2a37;
        --control-bg: #ffffff;
        --control-border: #cfd6e4;
        --control-text: #1f2937;
        --control-hover-bg: #eef2f7;
        --label-text: #2d3645;
        --hint-text: #5c6677;
        --layer-panel-bg: rgba(255, 255, 255, 0.96);
        --layer-item-bg: #ffffff;
        --layer-item-border: #dbe2ee;
        --layer-item-active-bg: #dbeafe;
        --layer-item-active-text: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, Arial, sans-serif;
        background: var(--bg);
      }

      .app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .toolbar {
        padding: 10px 12px;
        background: var(--panel-bg);
        border-bottom: 1px solid var(--panel-border);
        display: grid;
        gap: 8px;
        color: var(--panel-text);
        flex: 0 0 auto;
      }

      .toolbar-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        overflow: visible;
        white-space: normal;
        padding-bottom: 2px;
      }

      .toolbar-row > * {
        flex: 0 0 auto;
      }

      .toolbar-spacer {
        flex: 1 1 auto !important;
      }

      #action-bookmark,
      #action-exit,
      #action-fullscreen {
        min-width: 170px;
      }

      button,
      input,
      select {
        height: 34px;
        border: 1px solid var(--control-border);
        border-radius: 8px;
        background: var(--control-bg);
        color: var(--control-text);
        padding: 0 10px;
        cursor: pointer;
      }

      button:hover {
        background: var(--control-hover-bg);
      }

      button.active {
        border-color: #2563eb;
        color: #1d4ed8;
        background: #eaf2ff;
      }

      #theme-toggle {
        min-width: 64px;
        font-size: 18px;
      }

      .hint {
        color: var(--hint-text);
        font-size: 12px;
      }

      .save-status {
        min-width: 180px;
        text-align: right;
      }

      .save-status.ok {
        color: #86efac;
      }

      .save-status.warn {
        color: #fca5a5;
      }

      .label {
        font-size: 13px;
        color: var(--label-text);
      }

      .number-input {
        width: 72px;
      }

      #brush-size {
        width: 180px;
      }

      input[type="range"] {
        padding: 0;
      }

      .board {
        position: relative;
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
      }

      .floating-fullscreen-exit {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 9999;
        background: rgba(17, 24, 39, 0.9);
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        height: 36px;
        padding: 0 12px;
        cursor: pointer;
      }

      .floating-fullscreen-exit[hidden] {
        display: none !important;
      }

      body.is-fullscreen .toolbar {
        display: none;
      }

      body.is-fullscreen .layers-panel {
        display: none !important;
      }

      body.is-fullscreen .board {
        height: 100%;
      }

      .canvas-wrap {
        width: 100%;
        height: 100%;
        background: #ffffff;
      }

      #drawing-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .layers-panel {
        position: absolute;
        top: 12px;
        right: 12px;
        bottom: 12px;
        width: var(--panel-width);
        background: var(--layer-panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        backdrop-filter: blur(2px);
        color: var(--panel-text);
      }

      .layers-header {
        padding: 10px 12px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .layers-list {
        margin: 0;
        padding: 10px;
        list-style: none;
        overflow: auto;
        display: grid;
        gap: 6px;
      }

      .layer-item {
        border: 1px solid var(--layer-item-border);
        border-radius: 8px;
        padding: 8px;
        display: grid;
        gap: 6px;
        font-size: 13px;
        background: var(--layer-item-bg);
      }

      .layer-item.active {
        border-color: #4f8bf9;
        background: var(--layer-item-active-bg);
        color: var(--layer-item-active-text);
      }

      .layer-item-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .layer-actions {
        display: flex;
        gap: 6px;
      }

      .layer-actions button {
        height: 26px;
        font-size: 12px;
        padding: 0 8px;
      }

    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <div class="toolbar-row">
          <button id="select-tool" class="active">Выбор (V)</button>
          <button id="draw-tool">Кисть (B)</button>
          <button id="eraser-tool">Ластик (E)</button>
          <button id="line-tool">Линия (L)</button>
          <button id="rect-tool">Прямоугольник (R)</button>
          <button id="circle-tool">Круг (O)</button>
          <button id="square-tool">Квадрат (Q)</button>
          <button id="text-tool">Текст (T)</button>
          <span class="label">Цвет</span>
          <input id="color-picker" type="color" value="#111111" />
          <span class="label">Размер</span>
          <input id="brush-size" type="range" min="1" max="100" value="5" />
          <span id="brush-size-label" class="label">5</span>
          <button id="undo-action">Отменить</button>
          <button id="delete-selected">Удалить</button>
          <button id="clear-canvas">Очистить всё</button>
        </div>
        <div class="toolbar-row">
          <span class="label">Шрифт</span>
          <select id="font-family">
            <option value="Inter">Inter</option>
            <option value="Arial">Arial</option>
            <option value="Roboto">Roboto</option>
            <option value="Open Sans">Open Sans</option>
            <option value="Montserrat">Montserrat</option>
            <option value="Poppins">Poppins</option>
            <option value="Lato">Lato</option>
            <option value="Nunito">Nunito</option>
            <option value="Merriweather">Merriweather</option>
            <option value="Playfair Display">Playfair Display</option>
            <option value="Ubuntu">Ubuntu</option>
            <option value="Georgia">Georgia</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Verdana">Verdana</option>
            <option value="Trebuchet MS">Trebuchet MS</option>
            <option value="Courier New">Courier New</option>
            <option value="Tahoma">Tahoma</option>
          </select>
          <span class="label">Цвет текста</span>
          <input id="text-color-picker" type="color" value="#111111" />
          <input id="text-size" class="number-input" type="number" min="8" max="200" value="28" />
          <button id="text-bold" title="Жирный">B</button>
          <button id="text-italic" title="Курсив">I</button>
          <button id="text-underline" title="Подчеркнутый">U</button>
          <button id="text-strike" title="Перечеркнутый">S</button>
          <span class="label">Zoom</span>
          <button id="zoom-out">-</button>
          <button id="zoom-in">+</button>
          <button id="zoom-reset">100%</button>
          <span id="zoom-label" class="label">100%</span>
          <button id="export-png">Экспорт PNG</button>
          <button id="export-svg">Экспорт SVG</button>
          <button id="export-json">Скачать JSON</button>
          <button id="import-json">Загрузить JSON</button>
          <input id="import-json-file" type="file" accept=".json" hidden />
          <button id="theme-toggle" title="Переключить тему">☀️</button>
          <button id="toggle-layers">Скрыть слои</button>
          <span class="toolbar-spacer"></span>
          <button id="action-bookmark">☆ Добавить в закладки</button>
          <button id="action-exit">💾 Сохранить и выйти</button>
          <button id="action-fullscreen">⛶ Полный экран</button>
          <span id="save-status" class="hint save-status">Сохранение: ожидание</span>
          <span id="preview-status" class="hint save-status">Предпросмотр: без обновления</span>
          <span class="hint">Панорамирование: удерживай пробел + drag</span>
        </div>
      </div>

      <div class="board">
        <button id="floating-fullscreen-exit" class="floating-fullscreen-exit" hidden>
          ← Обычный режим
        </button>
        <div class="canvas-wrap">
          <canvas id="drawing-canvas"></canvas>
        </div>

        <aside class="layers-panel">
          <div class="layers-header">
            <strong>Слои</strong>
            <button id="refresh-layers">Обновить</button>
          </div>
          <ul id="layers-list" class="layers-list"></ul>
        </aside>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
    <script>
      const query = new URLSearchParams(window.location.search);
      const boardBb = query.get("bb") || "0";
      const boardId = query.get("board") || "board-1";
      const isReadOnly = query.get("readonly") === "1";
      const boardStorageKey = `ink-auth-fabric-bb-${boardBb}-${boardId}`;
      const boardThumbKey = `ink-auth-fabric-thumb-bb-${boardBb}-${boardId}`;
      const boardPreviewKey = `ink-auth-fabric-preview-bb-${boardBb}-${boardId}`;
      const PREVIEW_EXPORT_MULTIPLIER = 3;
      const API_BASE = "/api";
      const SAVE_TIMEOUT_MS = 12000;
      let remoteSaveTimer = null;

      const canvas = new fabric.Canvas("drawing-canvas", {
        backgroundColor: "#ffffff",
        preserveObjectStacking: true,
        fireRightClick: true,
        stopContextMenu: true
      });

      const canvasWrap = document.querySelector(".canvas-wrap");
      const layersList = document.getElementById("layers-list");
      const layersPanel = document.querySelector(".layers-panel");
      const toggleLayersBtn = document.getElementById("toggle-layers");
      const floatingFullscreenExitBtn = document.getElementById("floating-fullscreen-exit");
      const actionBookmarkBtn = document.getElementById("action-bookmark");
      const actionExitBtn = document.getElementById("action-exit");
      const actionFullscreenBtn = document.getElementById("action-fullscreen");
      const saveStatus = document.getElementById("save-status");
      const previewStatus = document.getElementById("preview-status");
      const colorPicker = document.getElementById("color-picker");
      const brushSize = document.getElementById("brush-size");
      const brushSizeLabel = document.getElementById("brush-size-label");
      const zoomLabel = document.getElementById("zoom-label");
      const themeToggle = document.getElementById("theme-toggle");
      const fontFamilySelect = document.getElementById("font-family");
      const textColorPicker = document.getElementById("text-color-picker");
      const textSizeInput = document.getElementById("text-size");
      const textStyleButtons = {
        bold: document.getElementById("text-bold"),
        italic: document.getElementById("text-italic"),
        underline: document.getElementById("text-underline"),
        strike: document.getElementById("text-strike")
      };

      const tools = {
        select: document.getElementById("select-tool"),
        draw: document.getElementById("draw-tool"),
        eraser: document.getElementById("eraser-tool"),
        line: document.getElementById("line-tool"),
        rect: document.getElementById("rect-tool"),
        circle: document.getElementById("circle-tool"),
        square: document.getElementById("square-tool"),
        text: document.getElementById("text-tool")
      };

      const state = {
        mode: "select",
        currentShape: null,
        startX: 0,
        startY: 0,
        drawingShape: false,
        zoom: 1,
        isPanning: false,
        isRightPanning: false,
        lastPanX: 0,
        lastPanY: 0,
        spacePressed: false,
        history: [],
        historyIndex: -1,
        isHistoryBusy: false,
        clipboard: null,
        guideLines: [],
        saveCropMode: false,
        saveCropRect: null,
        cropStartX: 0,
        cropStartY: 0,
        cropStartScreenX: 0,
        cropStartScreenY: 0,
        cropEndScreenX: 0,
        cropEndScreenY: 0,
        pendingCropResolve: null
      };

      function setLayersVisible(visible) {
        if (!layersPanel || !toggleLayersBtn) return;
        layersPanel.style.display = visible ? "" : "none";
        toggleLayersBtn.textContent = visible ? "Скрыть слои" : "Показывать слои";
      }

      function toggleFullscreenMode() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.();
          return;
        }
        document.exitFullscreen?.();
      }

      function syncFullscreenLabel() {
        if (!actionFullscreenBtn) return;
        actionFullscreenBtn.textContent = document.fullscreenElement
          ? "🗗 Обычный экран"
          : "⛶ Полный экран";
        const isFullscreen = Boolean(document.fullscreenElement);
        document.body.classList.toggle("is-fullscreen", isFullscreen);
        if (floatingFullscreenExitBtn) {
          floatingFullscreenExitBtn.hidden = !isFullscreen;
        }
        // В fullscreen меняется доступная высота: принудительно пересчитываем размер холста.
        requestAnimationFrame(() => resizeCanvas());
      }

      // Единый аккуратный стиль контролов Fabric (рамка/хэндлы/поворот)
      fabric.Object.prototype.transparentCorners = false;
      fabric.Object.prototype.cornerStyle = "circle";
      fabric.Object.prototype.cornerColor = "#ffffff";
      fabric.Object.prototype.cornerStrokeColor = "#2563eb";
      fabric.Object.prototype.cornerSize = 10;
      fabric.Object.prototype.borderColor = "#2563eb";
      fabric.Object.prototype.borderDashArray = [5, 4];
      fabric.Object.prototype.borderScaleFactor = 1.3;
      fabric.Object.prototype.padding = 5;
      fabric.Object.prototype.rotatingPointOffset = 22;

      const baseControls = fabric.Object.prototype.controls;

      function drawControlCircle(ctx, left, top, radius, fill, stroke) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(left, top, radius, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = stroke;
          ctx.stroke();
        }
        ctx.restore();
      }

      function makeArrowRenderer(glyph) {
        return function renderArrow(ctx, left, top) {
          drawControlCircle(ctx, left, top, 9, "#ffffff", "#2563eb");
          ctx.save();
          ctx.fillStyle = "#1d4ed8";
          ctx.font = "bold 12px Inter, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(glyph, left, top + 0.5);
          ctx.restore();
        };
      }

      function renderRotateIcon(ctx, left, top) {
        drawControlCircle(ctx, left, top, 10, "#ffffff", "#0f766e");
        ctx.save();
        ctx.fillStyle = "#0f766e";
        ctx.font = "bold 12px Inter, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("↻", left, top + 0.5);
        ctx.restore();
      }

      function renderMoveDot(ctx, left, top) {
        drawControlCircle(ctx, left, top, 6, "#111827", "#f8fafc");
      }

      function getCustomControls() {
        return {
          tl: new fabric.Control({
            x: -0.5,
            y: -0.5,
            offsetX: -10,
            offsetY: -10,
            cursorStyle: "nwse-resize",
            actionHandler: baseControls.tl.actionHandler,
            getActionName: baseControls.tl.getActionName,
            render: makeArrowRenderer("↖")
          }),
          tr: new fabric.Control({
            x: 0.5,
            y: -0.5,
            offsetX: 10,
            offsetY: -10,
            cursorStyle: "nesw-resize",
            actionHandler: baseControls.tr.actionHandler,
            getActionName: baseControls.tr.getActionName,
            render: makeArrowRenderer("↗")
          }),
          bl: new fabric.Control({
            x: -0.5,
            y: 0.5,
            offsetX: -10,
            offsetY: 10,
            cursorStyle: "nesw-resize",
            actionHandler: baseControls.bl.actionHandler,
            getActionName: baseControls.bl.getActionName,
            render: makeArrowRenderer("↙")
          }),
          br: new fabric.Control({
            x: 0.5,
            y: 0.5,
            offsetX: 10,
            offsetY: 10,
            cursorStyle: "nwse-resize",
            actionHandler: baseControls.br.actionHandler,
            getActionName: baseControls.br.getActionName,
            render: makeArrowRenderer("↘")
          }),
          mt: new fabric.Control({
            x: 0,
            y: -0.5,
            offsetY: -16,
            cursorStyle: "ns-resize",
            actionHandler: baseControls.mt.actionHandler,
            getActionName: baseControls.mt.getActionName,
            render: makeArrowRenderer("↑")
          }),
          mb: new fabric.Control({
            x: 0,
            y: 0.5,
            offsetY: 16,
            cursorStyle: "ns-resize",
            actionHandler: baseControls.mb.actionHandler,
            getActionName: baseControls.mb.getActionName,
            render: makeArrowRenderer("↓")
          }),
          ml: new fabric.Control({
            x: -0.5,
            y: 0,
            offsetX: -16,
            cursorStyle: "ew-resize",
            actionHandler: baseControls.ml.actionHandler,
            getActionName: baseControls.ml.getActionName,
            render: makeArrowRenderer("←")
          }),
          mr: new fabric.Control({
            x: 0.5,
            y: 0,
            offsetX: 16,
            cursorStyle: "ew-resize",
            actionHandler: baseControls.mr.actionHandler,
            getActionName: baseControls.mr.getActionName,
            render: makeArrowRenderer("→")
          }),
          mtr: new fabric.Control({
            x: 0,
            y: -0.5,
            offsetY: -36,
            cursorStyleHandler: fabric.controlsUtils.rotationStyleHandler,
            actionHandler: fabric.controlsUtils.rotationWithSnapping,
            actionName: "rotate",
            render: renderRotateIcon
          }),
          moveTop: new fabric.Control({
            x: 0,
            y: -0.5,
            offsetY: 2,
            cursorStyle: "move",
            actionHandler: fabric.controlsUtils.dragHandler,
            actionName: "drag",
            render: renderMoveDot
          })
        };
      }

      function styleObjectControls(obj) {
        if (!obj || obj.excludeFromExport) return;
        const customControls = getCustomControls();
        obj.set({
          cornerStyle: "circle",
          cornerColor: "#ffffff",
          cornerStrokeColor: "#2563eb",
          cornerSize: 10,
          borderColor: "#2563eb",
          borderDashArray: [5, 4],
          borderScaleFactor: 1.3,
          padding: 5,
          rotatingPointOffset: 22,
          transparentCorners: false
        });
        obj.controls = {
          ...obj.controls,
          ...customControls
        };
        // Показываем стрелки растягивания по 4 сторонам, иконку поворота и точку перемещения.
        if (typeof obj.setControlsVisibility === "function") {
          obj.setControlsVisibility({
            mt: true,
            mb: true,
            ml: true,
            mr: true,
            tl: true,
            tr: true,
            bl: true,
            br: true,
            mtr: true,
            moveTop: true
          });
        }
      }

      function isDrawableObject(obj) {
        return obj && !obj.excludeFromExport;
      }

      function getProjectJSON() {
        const drawables = canvas.getObjects().filter((obj) => isDrawableObject(obj));
        const data = drawables.map((obj) => obj.toObject(["name", "lockMovementX", "lockMovementY"]));
        return JSON.stringify({
          version: "fabric-pro-v1",
          backgroundColor: "#ffffff",
          objects: data
        });
      }

      function saveHistorySnapshot() {
        if (state.isHistoryBusy) return;
        const snapshot = getProjectJSON();
        if (state.history[state.historyIndex] === snapshot) return;

        state.history = state.history.slice(0, state.historyIndex + 1);
        state.history.push(snapshot);
        state.historyIndex = state.history.length - 1;
        localStorage.setItem(boardStorageKey, snapshot);
        saveBoardThumbnail();
      }

      function saveBoardThumbnail(cropOverride = null) {
        try {
          if (cropOverride && cropOverride.type === "screenExact") {
            const srcCanvas = canvas.lowerCanvasEl;
            const ratioX = srcCanvas.width / Math.max(1, canvas.getWidth());
            const ratioY = srcCanvas.height / Math.max(1, canvas.getHeight());
            const sx = Math.max(0, Math.floor(cropOverride.left * ratioX));
            const sy = Math.max(0, Math.floor(cropOverride.top * ratioY));
            const sw = Math.max(1, Math.floor(cropOverride.width * ratioX));
            const sh = Math.max(1, Math.floor(cropOverride.height * ratioY));
            const safeW = Math.max(1, Math.min(sw, srcCanvas.width - sx));
            const safeH = Math.max(1, Math.min(sh, srcCanvas.height - sy));

            const previewScale = PREVIEW_EXPORT_MULTIPLIER;
            const previewCanvas = document.createElement("canvas");
            previewCanvas.width = Math.max(1, Math.floor(safeW * previewScale));
            previewCanvas.height = Math.max(1, Math.floor(safeH * previewScale));
            const previewCtx = previewCanvas.getContext("2d");
            previewCtx.imageSmoothingEnabled = false;
            previewCtx.drawImage(
              srcCanvas,
              sx,
              sy,
              safeW,
              safeH,
              0,
              0,
              previewCanvas.width,
              previewCanvas.height,
            );

            const thumbScale = Math.min(1, 280 / Math.max(safeW, safeH));
            const thumbW = Math.max(1, Math.floor(safeW * thumbScale));
            const thumbH = Math.max(1, Math.floor(safeH * thumbScale));
            const thumbCanvas = document.createElement("canvas");
            thumbCanvas.width = thumbW;
            thumbCanvas.height = thumbH;
            const thumbCtx = thumbCanvas.getContext("2d");
            thumbCtx.imageSmoothingEnabled = true;
            thumbCtx.imageSmoothingQuality = "high";
            thumbCtx.drawImage(previewCanvas, 0, 0, safeW, safeH, 0, 0, thumbW, thumbH);

            localStorage.setItem(boardPreviewKey, previewCanvas.toDataURL("image/png"));
            localStorage.setItem(boardThumbKey, thumbCanvas.toDataURL("image/png"));
            return;
          }

          if (cropOverride && cropOverride.type === "canvas") {
            const exportArea = {
              left: Math.max(0, cropOverride.left),
              top: Math.max(0, cropOverride.top),
              width: Math.max(1, cropOverride.width),
              height: Math.max(1, cropOverride.height)
            };
            const preview = canvas.toDataURL({
              format: "png",
              quality: 1,
              multiplier: PREVIEW_EXPORT_MULTIPLIER,
              withoutTransform: true,
              ...exportArea
            });
            const thumb = canvas.toDataURL({
              format: "png",
              quality: 1,
              multiplier: 1,
              withoutTransform: true,
              ...exportArea
            });
            localStorage.setItem(boardPreviewKey, preview);
            localStorage.setItem(boardThumbKey, thumb);
            return;
          }

          const drawables = canvas.getObjects().filter((obj) => isDrawableObject(obj));
          let crop = null;
          if (drawables.length) {
            let minLeft = Number.POSITIVE_INFINITY;
            let minTop = Number.POSITIVE_INFINITY;
            let maxRight = Number.NEGATIVE_INFINITY;
            let maxBottom = Number.NEGATIVE_INFINITY;
            drawables.forEach((obj) => {
              const bounds = obj.getBoundingRect(true, true);
              minLeft = Math.min(minLeft, bounds.left);
              minTop = Math.min(minTop, bounds.top);
              maxRight = Math.max(maxRight, bounds.left + bounds.width);
              maxBottom = Math.max(maxBottom, bounds.top + bounds.height);
            });
            const pad = 20;
            const left = Math.max(0, minLeft - pad);
            const top = Math.max(0, minTop - pad);
            const width = Math.max(1, Math.min(canvas.getWidth() - left, maxRight - minLeft + pad * 2));
            const height = Math.max(1, Math.min(canvas.getHeight() - top, maxBottom - minTop + pad * 2));
            crop = { left, top, width, height };
          }
          if (cropOverride && cropOverride.width > 1 && cropOverride.height > 1) {
            crop = cropOverride;
          }

          const thumb = canvas.toDataURL({
            format: "png",
            quality: 0.9,
            multiplier: 0.2,
            withoutTransform: true,
            ...(crop || {})
          });
          const preview = canvas.toDataURL({
            format: "png",
            quality: 1,
            multiplier: PREVIEW_EXPORT_MULTIPLIER,
            withoutTransform: true,
            ...(crop || {})
          });
          localStorage.setItem(boardThumbKey, thumb);
          localStorage.setItem(boardPreviewKey, preview);
        } catch {}
      }

      function restoreFromSnapshot(snapshot) {
        state.isHistoryBusy = true;
        canvas.clear();
        canvas.backgroundColor = "#ffffff";

        const data = JSON.parse(snapshot);
        fabric.util.enlivenObjects(data.objects, (objects) => {
          objects.forEach((obj) => canvas.add(obj));
          removeGridArtifacts();
          canvas.renderAll();
          updateLayersPanel();
          state.isHistoryBusy = false;
        });
      }

      function undo() {
        if (state.historyIndex <= 0) return;
        state.historyIndex -= 1;
        restoreFromSnapshot(state.history[state.historyIndex]);
      }

      function redo() {
        if (state.historyIndex >= state.history.length - 1) return;
        state.historyIndex += 1;
        restoreFromSnapshot(state.history[state.historyIndex]);
      }

      function downloadText(filename, text, type) {
        const blob = new Blob([text], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
      }

      function setZoom(value, centerPoint) {
        state.zoom = Math.min(5, Math.max(0.2, value));
        const point = centerPoint || new fabric.Point(canvas.getWidth() / 2, canvas.getHeight() / 2);
        canvas.zoomToPoint(point, state.zoom);
        zoomLabel.textContent = `${Math.round(state.zoom * 100)}%`;
      }

      function removeGridArtifacts() {
        canvas.getObjects().forEach((obj) => {
          const isLegacyGridLine =
            obj &&
            obj.type === "line" &&
            obj.excludeFromExport === true &&
            obj.selectable === false &&
            obj.evented === false &&
            !obj.isGuideLine;
          if ((obj && obj.isGridLine) || isLegacyGridLine) {
            canvas.remove(obj);
          }
        });
      }

      function clearGuides() {
        state.guideLines.forEach((line) => canvas.remove(line));
        state.guideLines = [];
      }

      function drawGuideLine(x1, y1, x2, y2) {
        const line = new fabric.Line([x1, y1, x2, y2], {
          stroke: "#22c55e",
          strokeWidth: 1,
          selectable: false,
          evented: false,
          excludeFromExport: true,
          hoverCursor: "default",
          isGuideLine: true
        });
        state.guideLines.push(line);
        canvas.add(line);
        line.bringToFront();
      }

      function applyTheme(theme) {
        const normalizedTheme = theme === "light" ? "light" : "dark";
        document.body.classList.toggle("theme-light", normalizedTheme === "light");
        themeToggle.textContent = normalizedTheme === "light" ? "🌙" : "☀️";
        themeToggle.title = normalizedTheme === "light" ? "Включить тёмную тему" : "Включить светлую тему";
        localStorage.setItem("fabric-theme", normalizedTheme);
      }

      function resizeCanvas() {
        const rect = canvasWrap.getBoundingClientRect();
        canvas.setWidth(rect.width);
        canvas.setHeight(rect.height);
        removeGridArtifacts();
        canvas.renderAll();
      }

      function getSelectedObjects() {
        const active = canvas.getActiveObject();
        if (!active) return [];
        if (active.type === "activeSelection") return active.getObjects();
        return [active];
      }

      function isTextObject(obj) {
        return obj && (obj.type === "i-text" || obj.type === "text" || obj.type === "textbox");
      }

      function getActiveTextStyle(obj, key) {
        if (!isTextObject(obj)) return null;
        if (obj.isEditing && obj.selectionStart !== obj.selectionEnd) {
          const styles = obj.getSelectionStyles(obj.selectionStart, obj.selectionEnd);
          if (styles && styles.length && styles[0][key] != null) {
            return styles[0][key];
          }
        }
        return obj[key];
      }

      function updateTextSizeControl() {
        const active = canvas.getActiveObject();
        if (!isTextObject(active)) {
          Object.values(textStyleButtons).forEach((btn) => btn.classList.remove("active"));
          return;
        }

        const currentSize = getActiveTextStyle(active, "fontSize");
        const currentFont = getActiveTextStyle(active, "fontFamily");
        const currentFill = getActiveTextStyle(active, "fill");
        const isBold = getActiveTextStyle(active, "fontWeight") === "bold";
        const isItalic = getActiveTextStyle(active, "fontStyle") === "italic";
        const isUnderline = Boolean(getActiveTextStyle(active, "underline"));
        const isStrike = Boolean(getActiveTextStyle(active, "linethrough"));
        if (currentSize) {
          textSizeInput.value = Math.round(currentSize);
        }
        if (currentFont) {
          fontFamilySelect.value = currentFont;
        }
        if (typeof currentFill === "string" && currentFill.startsWith("#")) {
          textColorPicker.value = currentFill;
        }
        textStyleButtons.bold.classList.toggle("active", isBold);
        textStyleButtons.italic.classList.toggle("active", isItalic);
        textStyleButtons.underline.classList.toggle("active", isUnderline);
        textStyleButtons.strike.classList.toggle("active", isStrike);
      }

      function applyTextStyle(styleObject) {
        const active = canvas.getActiveObject();
        if (!isTextObject(active)) return;

        if (active.isEditing && active.selectionStart !== active.selectionEnd) {
          active.setSelectionStyles(styleObject, active.selectionStart, active.selectionEnd);
        } else {
          active.set(styleObject);
        }

        canvas.requestRenderAll();
        saveHistorySnapshot();
        updateLayersPanel();
        updateTextSizeControl();
      }

      function toggleTextStyle(styleName) {
        const active = canvas.getActiveObject();
        if (!isTextObject(active)) return;

        if (styleName === "bold") {
          const current = getActiveTextStyle(active, "fontWeight") === "bold";
          applyTextStyle({ fontWeight: current ? "normal" : "bold" });
          return;
        }
        if (styleName === "italic") {
          const current = getActiveTextStyle(active, "fontStyle") === "italic";
          applyTextStyle({ fontStyle: current ? "normal" : "italic" });
          return;
        }
        if (styleName === "underline") {
          const current = Boolean(getActiveTextStyle(active, "underline"));
          applyTextStyle({ underline: !current });
          return;
        }
        if (styleName === "strike") {
          const current = Boolean(getActiveTextStyle(active, "linethrough"));
          applyTextStyle({ linethrough: !current });
        }
      }

      function copySelection() {
        const active = canvas.getActiveObject();
        if (!active) return;
        active.clone((cloned) => {
          state.clipboard = cloned;
        });
      }

      function pasteSelection() {
        if (!state.clipboard) return;
        state.clipboard.clone((clonedObj) => {
          canvas.discardActiveObject();
          if (clonedObj.type === "activeSelection") {
            clonedObj.canvas = canvas;
            clonedObj.forEachObject((obj) => {
              obj.set({ left: (obj.left || 0) + 20, top: (obj.top || 0) + 20 });
              canvas.add(obj);
            });
            const newSel = new fabric.ActiveSelection(clonedObj.getObjects(), { canvas });
            canvas.setActiveObject(newSel);
          } else {
            clonedObj.set({ left: (clonedObj.left || 0) + 20, top: (clonedObj.top || 0) + 20, evented: true });
            canvas.add(clonedObj);
            canvas.setActiveObject(clonedObj);
          }
          canvas.renderAll();
          copySelection();
          saveHistorySnapshot();
          updateLayersPanel();
        });
      }

      function updateLayersPanel() {
        const objects = canvas.getObjects().filter((obj) => isDrawableObject(obj)).reverse();
        layersList.innerHTML = "";

        objects.forEach((obj) => {
          const li = document.createElement("li");
          li.className = "layer-item";
          if (canvas.getActiveObject() === obj) {
            li.classList.add("active");
          }

          const type = obj.type || "object";
          const title = obj.name || `${type}`;

          li.innerHTML = `
            <div class="layer-item-head">
              <span>${title}</span>
              <span>${type}</span>
            </div>
            <div class="layer-actions">
              <button data-act="select">Select</button>
              <button data-act="up">Up</button>
              <button data-act="down">Down</button>
              <button data-act="toggle">${obj.visible === false ? "Show" : "Hide"}</button>
              <button data-act="lock">${obj.lockMovementX ? "Unlock" : "Lock"}</button>
            </div>
          `;

          li.addEventListener("click", (event) => {
            const action = event.target.getAttribute("data-act");
            if (!action) return;

            if (action === "select") {
              canvas.setActiveObject(obj);
            } else if (action === "up") {
              canvas.bringForward(obj);
              saveHistorySnapshot();
            } else if (action === "down") {
              canvas.sendBackwards(obj);
              saveHistorySnapshot();
            } else if (action === "toggle") {
              obj.visible = obj.visible === false;
              saveHistorySnapshot();
            } else if (action === "lock") {
              const lock = !obj.lockMovementX;
              obj.lockMovementX = lock;
              obj.lockMovementY = lock;
              obj.lockScalingX = lock;
              obj.lockScalingY = lock;
              obj.lockRotation = lock;
              saveHistorySnapshot();
            }

            canvas.renderAll();
            updateLayersPanel();
          });

          layersList.appendChild(li);
        });
      }

      function setSaveStatus(text, kind = "") {
        if (!saveStatus) return;
        saveStatus.textContent = text;
        saveStatus.classList.remove("ok", "warn");
        if (kind) saveStatus.classList.add(kind);
      }

      function setPreviewStatus(text, kind = "") {
        if (!previewStatus) return;
        previewStatus.textContent = text;
        previewStatus.classList.remove("ok", "warn");
        if (kind) previewStatus.classList.add(kind);
      }

      function setActiveButton(mode) {
        Object.entries(tools).forEach(([key, btn]) => {
          btn.classList.toggle("active", key === mode);
        });
      }

      function setupBrush(color, size) {
        canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
        canvas.freeDrawingBrush.color = color;
        canvas.freeDrawingBrush.width = Number(size);
      }

      function setMode(mode) {
        state.mode = mode;
        setActiveButton(mode);
        canvas.isDrawingMode = mode === "draw" || mode === "eraser";
        canvas.selection = mode === "select";
        canvas.skipTargetFind = mode === "draw" || mode === "eraser";

        // В режиме кисти/ластика не оставляем активное выделение,
        // чтобы первый же жест сразу рисовал линию.
        if (mode === "draw" || mode === "eraser") {
          canvas.discardActiveObject();
        }

        canvas.forEachObject((obj) => {
          if (!isDrawableObject(obj)) return;
          obj.selectable = mode === "select";
          obj.evented = mode === "select";
        });
        canvas.requestRenderAll();

        if (mode === "draw") {
          setupBrush(colorPicker.value, brushSize.value);
        } else if (mode === "eraser") {
          setupBrush("#ffffff", brushSize.value);
        }
      }

      function addText() {
        const textSize = Math.max(8, Math.min(200, Number(textSizeInput.value || 28)));
        const text = new fabric.IText("Введите текст", {
          left: 120,
          top: 120,
          fill: textColorPicker.value,
          fontSize: textSize,
          fontFamily: fontFamilySelect.value || "Inter",
          objectCaching: false,
          name: "Text"
        });
        styleObjectControls(text);
        canvas.add(text);
        canvas.setActiveObject(text);
        canvas.renderAll();
        saveHistorySnapshot();
        updateLayersPanel();
      }

      function exportPNG() {
        const data = canvas.toDataURL({
          format: "png",
          multiplier: 2,
          withoutTransform: true
        });
        const link = document.createElement("a");
        link.href = data;
        link.download = "fabric-pro.png";
        link.click();
      }

      function exportSVG() {
        const svg = canvas.toSVG();
        downloadText("fabric-pro.svg", svg, "image/svg+xml");
      }

      function exportJSON() {
        downloadText("fabric-pro.json", getProjectJSON(), "application/json");
      }

      function importJSON(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            const snapshot = JSON.stringify(data);
            restoreFromSnapshot(snapshot);
            state.history = [snapshot];
            state.historyIndex = 0;
            localStorage.setItem(boardStorageKey, snapshot);
            saveBoardThumbnail();
          } catch (error) {
            alert("Не удалось загрузить JSON: " + error.message);
          }
        };
        reader.readAsText(file);
      }

      tools.select.addEventListener("click", () => setMode("select"));
      tools.draw.addEventListener("click", () => setMode("draw"));
      tools.eraser.addEventListener("click", () => setMode("eraser"));
      tools.line.addEventListener("click", () => setMode("line"));
      tools.rect.addEventListener("click", () => setMode("rect"));
      tools.circle.addEventListener("click", () => setMode("circle"));
      tools.square.addEventListener("click", () => setMode("square"));
      tools.text.addEventListener("click", () => {
        setMode("select");
        addText();
      });

      colorPicker.addEventListener("input", () => {
        if (state.mode === "draw") {
          setupBrush(colorPicker.value, brushSize.value);
        }
        const active = canvas.getActiveObject();
        if (active && isDrawableObject(active)) {
          if (!isTextObject(active)) {
            active.set({ stroke: colorPicker.value, fill: active.fill === "transparent" ? "transparent" : colorPicker.value });
            canvas.renderAll();
            saveHistorySnapshot();
          }
        }
      });

      textColorPicker.addEventListener("input", () => {
        const active = canvas.getActiveObject();
        if (!isTextObject(active)) return;
        applyTextStyle({ fill: textColorPicker.value });
      });

      brushSize.addEventListener("input", () => {
        brushSizeLabel.textContent = brushSize.value;
        if (state.mode === "draw" || state.mode === "eraser") {
          setupBrush(state.mode === "eraser" ? "#ffffff" : colorPicker.value, brushSize.value);
        }
      });

      textSizeInput.addEventListener("change", () => {
        const active = canvas.getActiveObject();
        if (!isTextObject(active)) return;
        const size = Math.max(8, Math.min(200, Number(textSizeInput.value || 28)));
        applyTextStyle({ fontSize: size });
      });

      fontFamilySelect.addEventListener("change", () => {
        const active = canvas.getActiveObject();
        if (!isTextObject(active)) return;
        applyTextStyle({ fontFamily: fontFamilySelect.value });
      });
      textStyleButtons.bold.addEventListener("click", () => toggleTextStyle("bold"));
      textStyleButtons.italic.addEventListener("click", () => toggleTextStyle("italic"));
      textStyleButtons.underline.addEventListener("click", () => toggleTextStyle("underline"));
      textStyleButtons.strike.addEventListener("click", () => toggleTextStyle("strike"));

      document.getElementById("zoom-in").addEventListener("click", () => setZoom(state.zoom + 0.1));
      document.getElementById("zoom-out").addEventListener("click", () => setZoom(state.zoom - 0.1));
      document.getElementById("zoom-reset").addEventListener("click", () => {
        canvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
        setZoom(1);
      });
      document.getElementById("export-png").addEventListener("click", exportPNG);
      document.getElementById("export-svg").addEventListener("click", exportSVG);
      document.getElementById("export-json").addEventListener("click", exportJSON);
      document.getElementById("refresh-layers").addEventListener("click", updateLayersPanel);
      document.getElementById("import-json").addEventListener("click", () => {
        document.getElementById("import-json-file").click();
      });
      document.getElementById("import-json-file").addEventListener("change", (event) => {
        importJSON(event.target.files[0]);
        event.target.value = "";
      });
      themeToggle.addEventListener("click", () => {
        const isLight = document.body.classList.contains("theme-light");
        applyTheme(isLight ? "dark" : "light");
      });
      if (toggleLayersBtn) {
        toggleLayersBtn.addEventListener("click", () => {
          const visible = layersPanel.style.display !== "none";
          setLayersVisible(!visible);
        });
      }
      if (actionBookmarkBtn) {
        actionBookmarkBtn.addEventListener("click", () => {
          window.parent.postMessage({ type: "fabric-bookmark-request" }, "*");
        });
      }
      if (actionExitBtn) {
        actionExitBtn.addEventListener("click", () => {
          window.parent.postMessage({ type: "fabric-exit-request" }, "*");
        });
      }
      if (actionFullscreenBtn) {
        actionFullscreenBtn.addEventListener("click", () => {
          toggleFullscreenMode();
        });
      }
      if (floatingFullscreenExitBtn) {
        floatingFullscreenExitBtn.addEventListener("click", () => {
          if (!document.fullscreenElement) return;
          document.exitFullscreen?.();
        });
      }

      document.getElementById("delete-selected").addEventListener("click", () => {
        const active = canvas.getActiveObjects();
        if (!active.length) return;
        active.forEach((obj) => canvas.remove(obj));
        canvas.discardActiveObject();
        canvas.renderAll();
        saveHistorySnapshot();
        updateLayersPanel();
      });

      document.getElementById("undo-action").addEventListener("click", () => {
        undo();
      });

      document.getElementById("clear-canvas").addEventListener("click", () => {
        canvas.getObjects().filter((obj) => isDrawableObject(obj)).forEach((obj) => canvas.remove(obj));
        canvas.backgroundColor = "#ffffff";
        removeGridArtifacts();
        canvas.renderAll();
        saveHistorySnapshot();
        updateLayersPanel();
      });

      async function saveBoardStateToServer(snapshot, thumb, preview) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), SAVE_TIMEOUT_MS);
        const payload = {
          snapshot,
          thumb
        };
        if (typeof preview === "string") {
          payload.preview = preview;
        }
        let response;
        try {
          response = await fetch(`${API_BASE}/board-state/${boardBb}/${boardId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
        } finally {
          window.clearTimeout(timeout);
        }
        if (!response.ok) throw new Error("Cannot save board state to server");
      }

      async function loadBoardStateFromServer() {
        const response = await fetch(`${API_BASE}/board-state/${boardBb}/${boardId}`);
        if (!response.ok) throw new Error("Cannot load board state from server");
        const payload = await response.json();
        return payload?.found ? payload : null;
      }

      async function sendRemoteState({ retries = 1 }) {
        const snapshot = localStorage.getItem(boardStorageKey);
        if (!snapshot) return true;
        const thumb = localStorage.getItem(boardThumbKey);
        const preview = localStorage.getItem(boardPreviewKey);
        for (let attempt = 1; attempt <= retries + 1; attempt += 1) {
          try {
            setSaveStatus("Сохранение: отправка...", "");
            await saveBoardStateToServer(snapshot, thumb, preview);
            setSaveStatus("Сохранение: в базе", "ok");
            return true;
          } catch {
            if (attempt > retries) {
              setSaveStatus("Сохранение: ошибка сети", "warn");
              return false;
            }
            await new Promise((resolve) => window.setTimeout(resolve, 500 * attempt));
          }
        }
        return false;
      }

      function scheduleRemoteSave() {
        if (remoteSaveTimer) window.clearTimeout(remoteSaveTimer);
        remoteSaveTimer = window.setTimeout(() => {
          remoteSaveTimer = null;
          void sendRemoteState({ retries: 0 });
        }, 700);
      }

      async function flushRemoteSaveNow() {
        if (remoteSaveTimer) {
          window.clearTimeout(remoteSaveTimer);
          remoteSaveTimer = null;
        }
        return sendRemoteState({ retries: 2 });
      }

      function persistBoardState(cropOverride = null) {
        localStorage.setItem(boardStorageKey, getProjectJSON());
        saveBoardThumbnail(cropOverride);
        scheduleRemoteSave();
      }

      async function loadBoardState() {
        try {
          const remote = await loadBoardStateFromServer();
          if (remote?.snapshot) {
            localStorage.setItem(boardStorageKey, remote.snapshot);
            if (typeof remote.thumb === "string") localStorage.setItem(boardThumbKey, remote.thumb);
            if (typeof remote.preview === "string") localStorage.setItem(boardPreviewKey, remote.preview);
          }
        } catch {}

        const saved = localStorage.getItem(boardStorageKey);
        if (!saved) {
          saveHistorySnapshot();
          return;
        }
        state.isHistoryBusy = true;
        restoreFromSnapshot(saved);
        state.history = [saved];
        state.historyIndex = 0;
      }

      function applyReadonlyMode() {
        if (!isReadOnly) return;
        document.querySelectorAll("button, input, select").forEach((el) => {
          if (
            el.id === "theme-toggle" ||
            el.id === "action-exit" ||
            el.id === "action-fullscreen"
          ) {
            return;
          }
          el.disabled = true;
        });
        canvas.selection = false;
        canvas.isDrawingMode = false;
        canvas.forEachObject((obj) => {
          obj.selectable = false;
          obj.evented = false;
        });
        canvas.defaultCursor = "default";
        canvas.renderAll();
      }

      function pickSaveArea() {
        return new Promise((resolve) => {
          setPreviewStatus("Предпросмотр: выделите область...", "");
          state.saveCropMode = true;
          state.pendingCropResolve = resolve;
          state.saveCropRect = null;
          state.cropStartX = 0;
          state.cropStartY = 0;
          canvas.discardActiveObject();
          canvas.isDrawingMode = false;
          canvas.selection = false;
          canvas.defaultCursor = "crosshair";
          canvas.requestRenderAll();
        });
      }

      function finishSaveAreaSelection(crop) {
        if (state.saveCropRect) {
          canvas.remove(state.saveCropRect);
          state.saveCropRect = null;
          canvas.requestRenderAll();
        }
        state.saveCropMode = false;
        canvas.defaultCursor = "default";
        canvas.selection = state.mode === "select";
        if (state.mode === "draw" || state.mode === "eraser") {
          canvas.isDrawingMode = true;
        }
        const resolve = state.pendingCropResolve;
        state.pendingCropResolve = null;
        if (!crop) {
          setPreviewStatus("Предпросмотр: выбор отменён", "warn");
        } else {
          setPreviewStatus("Предпросмотр: область выбрана", "");
        }
        if (resolve) resolve(crop);
      }

      async function handleSaveRequest(chooseArea) {
        let crop = null;
        if (chooseArea) {
          const wantsArea = window.confirm(
            "Выбрать область для сохранения превью? Нажми OK, затем выдели область на холсте.",
          );
          if (wantsArea) {
            crop = await pickSaveArea();
          }
        }
        await new Promise((resolve) => requestAnimationFrame(resolve));
        persistBoardState(crop);
        const savedOk = await flushRemoteSaveNow();
        if (!savedOk) {
          alert("Не удалось сохранить на сервер. Проверьте сеть и повторите.");
          return;
        }
        if (chooseArea && crop) {
          setPreviewStatus("Предпросмотр: сохранён в базе", "ok");
        } else if (chooseArea && !crop) {
          setPreviewStatus("Предпросмотр: без изменений", "");
        }
        window.parent.postMessage({ type: "fabric-save-done" }, "*");
      }

      window.addEventListener("message", (event) => {
        if (!event.data) return;
        if (event.data.type === "fabric-bookmark-done") {
          if (actionBookmarkBtn && event.data.label) {
            const base = "☆ Добавить в закладки";
            actionBookmarkBtn.textContent = event.data.label;
            window.setTimeout(() => {
              actionBookmarkBtn.textContent = base;
            }, 1300);
          }
          return;
        }
        if (event.data.type !== "fabric-save-request") return;
        handleSaveRequest(Boolean(event.data.chooseArea));
      });

      canvas.on("mouse:wheel", (opt) => {
        const delta = opt.e.deltaY;
        let nextZoom = state.zoom * Math.pow(0.999, delta);
        nextZoom = Math.min(5, Math.max(0.2, nextZoom));
        setZoom(nextZoom, new fabric.Point(opt.e.offsetX, opt.e.offsetY));
        opt.e.preventDefault();
        opt.e.stopPropagation();
      });

      canvas.on("mouse:down", (opt) => {
        if (state.saveCropMode) {
          const pointer = canvas.getPointer(opt.e);
          const rect = canvas.upperCanvasEl.getBoundingClientRect();
          state.cropStartX = pointer.x;
          state.cropStartY = pointer.y;
          state.cropStartScreenX = opt.e.clientX - rect.left;
          state.cropStartScreenY = opt.e.clientY - rect.top;
          state.cropEndScreenX = state.cropStartScreenX;
          state.cropEndScreenY = state.cropStartScreenY;
          if (state.saveCropRect) {
            canvas.remove(state.saveCropRect);
          }
          state.saveCropRect = new fabric.Rect({
            left: pointer.x,
            top: pointer.y,
            width: 1,
            height: 1,
            fill: "rgba(37,99,235,0.15)",
            stroke: "#2563eb",
            strokeWidth: 1.5,
            strokeDashArray: [6, 4],
            selectable: false,
            evented: false,
            excludeFromExport: true
          });
          canvas.add(state.saveCropRect);
          canvas.requestRenderAll();
          opt.e.preventDefault();
          opt.e.stopPropagation();
          return;
        }
        if (opt.e.button === 2) {
          state.isRightPanning = true;
          state.isPanning = true;
          state.lastPanX = opt.e.clientX;
          state.lastPanY = opt.e.clientY;
          canvas.selection = false;
          opt.e.preventDefault();
          opt.e.stopPropagation();
          return;
        }
        if (state.spacePressed) {
          state.isPanning = true;
          canvas.selection = false;
          return;
        }

        if (!["line", "rect", "circle", "square"].includes(state.mode)) return;
        const pointer = canvas.getPointer(opt.e);
        state.startX = pointer.x;
        state.startY = pointer.y;
        state.drawingShape = true;

        if (state.mode === "line") {
          state.currentShape = new fabric.Line([state.startX, state.startY, state.startX, state.startY], {
            stroke: colorPicker.value,
            strokeWidth: Number(brushSize.value),
            selectable: false,
            evented: false,
            name: "Line"
          });
          styleObjectControls(state.currentShape);
        } else if (state.mode === "rect") {
          state.currentShape = new fabric.Rect({
            left: state.startX,
            top: state.startY,
            width: 0,
            height: 0,
            fill: "transparent",
            stroke: colorPicker.value,
            strokeWidth: Number(brushSize.value),
            selectable: false,
            evented: false,
            name: "Rect"
          });
          styleObjectControls(state.currentShape);
        } else if (state.mode === "circle") {
          state.currentShape = new fabric.Ellipse({
            left: state.startX,
            top: state.startY,
            rx: 0,
            ry: 0,
            fill: "transparent",
            stroke: colorPicker.value,
            strokeWidth: Number(brushSize.value),
            selectable: false,
            evented: false,
            name: "Ellipse"
          });
          styleObjectControls(state.currentShape);
        } else if (state.mode === "square") {
          state.currentShape = new fabric.Rect({
            left: state.startX,
            top: state.startY,
            width: 0,
            height: 0,
            fill: "transparent",
            stroke: colorPicker.value,
            strokeWidth: Number(brushSize.value),
            selectable: false,
            evented: false,
            name: "Square"
          });
          styleObjectControls(state.currentShape);
        }

        canvas.add(state.currentShape);
      });

      canvas.on("mouse:move", (opt) => {
        if (state.saveCropMode && state.saveCropRect) {
          const pointer = canvas.getPointer(opt.e);
          const rect = canvas.upperCanvasEl.getBoundingClientRect();
          const left = Math.min(state.cropStartX, pointer.x);
          const top = Math.min(state.cropStartY, pointer.y);
          const width = Math.abs(pointer.x - state.cropStartX);
          const height = Math.abs(pointer.y - state.cropStartY);
          state.cropEndScreenX = opt.e.clientX - rect.left;
          state.cropEndScreenY = opt.e.clientY - rect.top;
          state.saveCropRect.set({ left, top, width, height });
          state.saveCropRect.setCoords();
          canvas.requestRenderAll();
          return;
        }
        if (state.isPanning) {
          const dx = opt.e.clientX - state.lastPanX;
          const dy = opt.e.clientY - state.lastPanY;
          state.lastPanX = opt.e.clientX;
          state.lastPanY = opt.e.clientY;
          const delta = new fabric.Point(dx, dy);
          canvas.relativePan(delta);
          canvas.requestRenderAll();
          return;
        }

        if (!state.drawingShape || !state.currentShape) return;
        const pointer = canvas.getPointer(opt.e);
        const w = pointer.x - state.startX;
        const h = pointer.y - state.startY;

        if (state.mode === "line") {
          state.currentShape.set({ x2: pointer.x, y2: pointer.y });
        } else if (state.mode === "rect") {
          state.currentShape.set({
            left: w < 0 ? pointer.x : state.startX,
            top: h < 0 ? pointer.y : state.startY,
            width: Math.abs(w),
            height: Math.abs(h)
          });
        } else if (state.mode === "circle") {
          state.currentShape.set({
            left: w < 0 ? pointer.x : state.startX,
            top: h < 0 ? pointer.y : state.startY,
            rx: Math.abs(w) / 2,
            ry: Math.abs(h) / 2
          });
        } else if (state.mode === "square") {
          const side = Math.max(Math.abs(w), Math.abs(h));
          state.currentShape.set({
            left: w < 0 ? state.startX - side : state.startX,
            top: h < 0 ? state.startY - side : state.startY,
            width: side,
            height: side
          });
        }

        canvas.renderAll();
      });

      canvas.on("mouse:up", () => {
        if (state.saveCropMode) {
          const rect = state.saveCropRect;
          if (!rect || rect.width < 8 || rect.height < 8) {
            finishSaveAreaSelection(null);
            return;
          }
          const left = Math.min(state.cropStartScreenX, state.cropEndScreenX);
          const top = Math.min(state.cropStartScreenY, state.cropEndScreenY);
          const width = Math.abs(state.cropEndScreenX - state.cropStartScreenX);
          const height = Math.abs(state.cropEndScreenY - state.cropStartScreenY);
          finishSaveAreaSelection({
            type: "screenExact",
            left,
            top,
            width,
            height
          });
          return;
        }
        if (state.isPanning) {
          state.isPanning = false;
          state.isRightPanning = false;
          state.lastPanX = 0;
          state.lastPanY = 0;
          canvas.selection = state.mode === "select";
          clearGuides();
          return;
        }

        if (!state.currentShape) {
          clearGuides();
          return;
        }
        state.currentShape.set({ selectable: true, evented: true });
        state.currentShape = null;
        state.drawingShape = false;
        if (["line", "rect", "circle", "square"].includes(state.mode)) {
          setMode("select");
        }
        clearGuides();
        saveHistorySnapshot();
        updateLayersPanel();
      });

      canvas.on("path:created", (event) => {
        // Для режима рисования сразу фиксируем объект как невыделяемый
        // и принудительно обновляем canvas, чтобы линия была видна мгновенно.
        const path = event && event.path;
        if (path && (state.mode === "draw" || state.mode === "eraser")) {
          path.set({ selectable: false, evented: false });
          styleObjectControls(path);
        }
        saveHistorySnapshot();
        updateLayersPanel();
        canvas.requestRenderAll();
      });
      canvas.on("object:added", () => {
        canvas.getObjects().forEach((obj) => styleObjectControls(obj));
        updateLayersPanel();
        updateTextSizeControl();
        canvas.requestRenderAll();
      });
      canvas.on("object:modified", () => {
        saveHistorySnapshot();
        updateLayersPanel();
        updateTextSizeControl();
      });
      canvas.on("object:removed", () => {
        updateLayersPanel();
        updateTextSizeControl();
      });
      canvas.on("selection:created", () => {
        updateLayersPanel();
        updateTextSizeControl();
      });
      canvas.on("selection:updated", () => {
        updateLayersPanel();
        updateTextSizeControl();
      });
      canvas.on("selection:cleared", () => {
        updateLayersPanel();
        updateTextSizeControl();
      });
      canvas.on("text:selection:changed", updateTextSizeControl);
      canvas.on("text:editing:entered", updateTextSizeControl);
      canvas.on("text:changed", (event) => {
        if (event && event.target && typeof event.target.initDimensions === "function") {
          event.target.objectCaching = false;
          event.target.initDimensions();
          event.target.setCoords();
        }
        updateTextSizeControl();
        canvas.requestRenderAll();
      });

      // Snap/guide lines intentionally disabled for free moving.

      function isTypingTarget(target) {
        if (!target) return false;
        const tag = target.tagName;
        return tag === "INPUT" || tag === "TEXTAREA" || target.isContentEditable;
      }

      document.addEventListener("keydown", (event) => {
        const typingNow = isTypingTarget(event.target);

        if (event.code === "Space") {
          if (typingNow) return;
          state.spacePressed = true;
          canvas.defaultCursor = "grab";
        }

        if (event.ctrlKey || event.metaKey) {
          if (event.code === "KeyZ") {
            event.preventDefault();
            undo();
            return;
          }
          const activeText = canvas.getActiveObject();
          if (isTextObject(activeText) && (event.code === "KeyB" || event.code === "KeyI" || event.code === "KeyU")) {
            event.preventDefault();
            if (event.code === "KeyB") toggleTextStyle("bold");
            if (event.code === "KeyI") toggleTextStyle("italic");
            if (event.code === "KeyU") toggleTextStyle("underline");
            return;
          }
          if (typingNow) return;
          if (event.code === "KeyC") {
            event.preventDefault();
            copySelection();
          }
          if (event.code === "KeyV") {
            event.preventDefault();
            pasteSelection();
          }
          return;
        }

        if (typingNow) return;

        if (event.key === "Delete" || event.key === "Backspace") {
          const active = canvas.getActiveObjects();
          if (active.length) {
            active.forEach((obj) => canvas.remove(obj));
            canvas.discardActiveObject();
            canvas.renderAll();
            saveHistorySnapshot();
            updateLayersPanel();
          }
        }

        if (event.code === "KeyV") setMode("select");
        if (event.code === "KeyB") setMode("draw");
        if (event.code === "KeyE") setMode("eraser");
        if (event.code === "KeyL") setMode("line");
        if (event.code === "KeyR") setMode("rect");
        if (event.code === "KeyO") setMode("circle");
        if (event.code === "KeyQ") setMode("square");
        if (event.code === "KeyT") {
          setMode("select");
          addText();
        }
      });

      document.addEventListener("keyup", (event) => {
        if (event.code === "Space") {
          state.spacePressed = false;
          if (!state.isRightPanning) {
            state.isPanning = false;
          }
          canvas.defaultCursor = "default";
        }
      });

      canvas.upperCanvasEl.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      document.addEventListener("mouseup", () => {
        if (!state.isRightPanning) return;
        state.isPanning = false;
        state.isRightPanning = false;
        state.lastPanX = 0;
        state.lastPanY = 0;
        canvas.selection = state.mode === "select";
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || !state.saveCropMode) return;
        finishSaveAreaSelection(null);
      });
      document.addEventListener("fullscreenchange", syncFullscreenLabel);

      window.addEventListener("resize", resizeCanvas);

      const savedTheme = localStorage.getItem("fabric-theme");
      applyTheme(savedTheme || "dark");
      resizeCanvas();
      setMode("select");
      loadBoardState().finally(() => {
        applyReadonlyMode();
        updateLayersPanel();
        updateTextSizeControl();
        setLayersVisible(true);
        syncFullscreenLabel();
      });
    </script>
  </body>
</html>
