<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ИНК — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="page" id="page">
      <div class="burger-menu">
        <div class="burger-icon">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="side-panel">
        <ul>
          <li>Главная</li>
          <li>Буровые бригады</li>
          <li>Контакты</li>
        </ul>
      </div>
      <div class="realm" id="realm" aria-live="polite">
        <h1>Добро пожаловать</h1>
        <h1>Гуляев Денис Михайлович</h1>
      </div>
      <div class="brigades-page">
        <button class="back-btn">← Назад</button>
        <h2>Выберите буровую бригаду</h2>
        <div class="brigades-grid">
          <!-- Генерируем 30 кубиков -->
        </div>
      </div>
      <div class="board-page">
        <button class="back-btn">← Назад</button>
        <h2 id="board-title">Доска бригады</h2>
        <div class="board">
          <div class="column">
            <h3>План</h3>
            <div class="cards" id="plan-cards">
              <div class="card">Задача 1</div>
              <div class="card">Задача 2</div>
            </div>
          </div>
          <div class="column">
            <h3>В работе</h3>
            <div class="cards" id="work-cards">
              <div class="card">Задача 3</div>
            </div>
          </div>
          <div class="column">
            <h3>Готово</h3>
            <div class="cards" id="done-cards">
              <div class="card">Задача 4</div>
            </div>
          </div>
        </div>
      </div>

      <div class="gates-stage">
        <div class="gates" role="presentation">
          <div class="gate gate-left" aria-hidden="true"></div>
          <div class="gate gate-right" aria-hidden="true"></div>
        </div>
        <div class="ink-letters-normal" aria-hidden="true">
          <span>И</span><span>Н</span><span>К</span>
        </div>
        <div class="ink-lit-stack" aria-hidden="true">
          <div class="ink-letters">
            <span class="ink-ch">И</span><span class="ink-ch">Н</span
            ><span class="ink-ch">К</span>
          </div>
        </div>
      </div>

      <form class="auth" id="auth" autocomplete="on" novalidate>
        <h2>Вход</h2>
        <div class="field">
          <label for="user">Логин</label>
          <input
            id="user"
            name="username"
            type="text"
            autocomplete="username"
            required
          />
        </div>
        <div class="field">
          <label for="pass">Пароль</label>
          <input
            id="pass"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <p class="error" id="error" role="alert"></p>
        <button class="btn" type="submit" id="submit">Открыть</button>
        <p class="hint">
          Для проверки: логин <code>ink</code>, пароль <code>ink</code>.
          Замените проверку в скрипте на свой API.
        </p>
      </form>
    </div>
    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
